# Levanta MySQL + la app:   docker compose up -d --build
# Crea el primer usuario:   docker compose exec app node scripts/user.js add admin --rol admin
# Requiere un archivo .env (copia .env.example) con DB_PASSWORD y SESSION_SECRET.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MYSQL_DATABASE: ${DB_NAME:-aramo_personal}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    # Para importar tus datos reales la primera vez, descomenta:
    # volumes:
    #   - ./scripts/seed.local.json:/app/scripts/seed.local.json:ro

volumes:
  dbdata:
